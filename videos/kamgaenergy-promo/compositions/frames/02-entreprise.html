  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const strokes = ["#f02-p2","#f02-p1","#f02-p4","#f02-p7","#f02-p3"];
      strokes.forEach(function (sel) {

      tl.fromTo("#f02-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#f02-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);

      tl.fromTo("#f02-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.75);

      tl.to(strokes, { strokeDashoffset: 0, duration: 1.25, stagger: 0.12, ease: "power2.inOut" }, 0.5);
      tl.fromTo(["#f02-w1","#f02-w2"], { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.1, ease: "none" }, 1.0);
      tl.fromTo("#f02-band", { scaleX: 0, transformOrigin: "78px 338px" }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 1.15);

      tl.fromTo("#f02-sun", { opacity: 0, scale: 0.4, transformOrigin: "700px 60px" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 2.1);
      tl.fromTo("#f02-sunrays > path", { opacity: 0, scale: 0.5, transformOrigin: "700px 60px" }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.06, ease: "back.out(2)" }, 2.45);
      window.__timelines["f02-entreprise"] = tl;
    })();
